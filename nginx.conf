server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets never change
    location ^~ __BASE__/_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location __BASE__/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # With a base path: also accept requests whose prefix the proxy stripped
    #BASEONLY location = __BASE__ { return 301 __BASE__/; }
    #BASEONLY location / { rewrite ^(.*)$ __BASE__$1 last; }

    error_page 404 __BASE__/404.html;
}
